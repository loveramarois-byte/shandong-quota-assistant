name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  code-only:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SHANDONG_SKIP_AUTHORIZED_CATALOG_TESTS: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check dependency health
        run: python -m pip check

      - name: Compile source
        run: python -m compileall -q run.py app components controllers themes utils tests tools evaluation

      - name: Lint source
        run: python -m ruff check .

      - name: Discover all code tests
        run: python -m unittest discover -s tests -v

      - name: Run synthetic evaluation baseline
        run: python evaluation/run.py

  demo-db-integration:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Build public synthetic catalog
        run: python -m tools.build_demo_catalog --output build/demo_catalog.sqlite

      - name: Run demo database integration tests
        run: python -m unittest tests.test_demo_catalog -v

  package-smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Build public data-free package
        run: python -m PyInstaller --noconfirm --clean ShandongQuotaAssistant.spec

      - name: Verify packaged executable
        shell: pwsh
        run: |
          $exe = "dist/ShandongQuotaAssistant/ShandongQuotaAssistant.exe"
          if (-not (Test-Path $exe)) { throw "packaged executable missing" }
          if ((Get-Item $exe).Length -lt 1MB) { throw "packaged executable is unexpectedly small" }
